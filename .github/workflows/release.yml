# Publishing a GitHub release builds the binaries, the wheel and the sdist, attests them,
# attaches them to that release, then publishes to PyPI through trusted publishing.
# A manual run builds and uploads workflow artifacts only.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

env:
  # Empty on a manual run. Scripts read the tag from here, never from an inline expression.
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
  # A tag is v plus a canonical PEP 440 public version, so the wheel name, the metadata and
  # `hfox --version` agree.
  VERSION_RE: '^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))*((a|b|rc)(0|[1-9][0-9]*))?(\.post(0|[1-9][0-9]*))?(\.dev(0|[1-9][0-9]*))?$'

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-26-intel, target: macos-x86_64 }
          - { os: windows-latest, target: windows-x86_64, ext: .exe }
          - { os: windows-11-arm, target: windows-arm64, ext: .exe }
    defaults:
      run:
        shell: bash
    env:
      # uv's managed CPython needs only glibc 2.17; a runner or setup-python interpreter
      # would raise the binary's minimum glibc to the runner's.
      UV_PYTHON_PREFERENCE: only-managed
      BIN: dist/hfox-${{ matrix.target }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false

      # pyproject.toml keeps its placeholder here: `uv run --locked` rejects a changed
      # project version.
      - name: Stamp version
        if: github.event_name == 'release'
        run: |
          version=${TAG#v}
          if [[ "$TAG" != v* || ! "$version" =~ $VERSION_RE ]]; then
            echo "::error::Tag '$TAG' is not v plus a canonical PEP 440 version."
            exit 1
          fi
          sed -i.bak "s/^__version__ = .*/__version__ = \"$version\"/" src/hfox/__init__.py
          rm src/hfox/__init__.py.bak
          grep -qx "__version__ = \"$version\"" src/hfox/__init__.py

      # shellingham imports its platform module dynamically, which PyInstaller cannot see.
      - name: Build
        run: >-
          uv run --locked --isolated --no-dev --group build
          pyinstaller --onefile --name "hfox-$TARGET"
          --hidden-import shellingham.posix --hidden-import shellingham.nt
          --specpath build src/hfox/__main__.py
        env:
          TARGET: ${{ matrix.target }}

      - name: Smoke test
        run: |
          version=$("$BIN" --version | tr -d '\r')
          echo "$version"
          expected="hfox dev"
          if [[ -n "$TAG" ]]; then expected="hfox ${TAG#v}"; fi
          if [[ "$version" != "$expected" || "$("$BIN" -v | tr -d '\r')" != "$expected" ]]; then
            echo "::error::Binary reports '$version', expected '$expected'."
            exit 1
          fi
          "$BIN" --dry-run tickets get 1
        env:
          HFOX_SUBDOMAIN: example

      # A missing shellingham module fails with its own error. BSD ps lists only processes
      # with a controlling terminal, which a runner lacks, so on macOS the module loads and
      # then finds no shell; that answer passes.
      - name: Smoke test completion
        if: runner.os != 'Windows'
        run: |
          status=0
          out=$("$BIN" --show-completion 2>&1) || status=$?
          if [[ "$RUNNER_OS" == macOS && "$out" == "Shell  not supported." ]]; then
            exit 0
          fi
          if [[ $status -ne 0 || -z "$out" ]]; then
            echo "$out"
            echo "::error::--show-completion failed with exit $status."
            exit 1
          fi

      # Shell detection walks the parent processes; pwsh keeps that chain native on Windows.
      - name: Smoke test completion (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = & $env:BIN --show-completion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not "$script".Trim()) {
            Write-Output "::error::--show-completion printed nothing."
            exit 1
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.BIN }}
          archive: false
          if-no-files-found: error

  dist:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Stamp version
        if: github.event_name == 'release'
        run: |
          version=${TAG#v}
          if [[ "$TAG" != v* || ! "$version" =~ $VERSION_RE ]]; then
            echo "::error::Tag '$TAG' is not v plus a canonical PEP 440 version."
            exit 1
          fi
          uv version "$version" --frozen
          sed -i.bak "s/^__version__ = .*/__version__ = \"$version\"/" src/hfox/__init__.py
          rm src/hfox/__init__.py.bak
          grep -qx "__version__ = \"$version\"" src/hfox/__init__.py
          [ "$(uv version --short)" = "$version" ]

      - name: Build
        run: uv build

      - name: Verify wheel
        run: |
          expected="hfox dev"
          if [[ -n "$TAG" ]]; then expected="hfox ${TAG#v}"; fi
          wheel="dist/hfox-$(uv version --short)-py3-none-any.whl"
          version=$(uv run --isolated --no-project --with "$wheel" hfox --version)
          echo "$version"
          if [[ "$version" != "$expected" ]]; then
            echo "::error::Wheel reports '$version', expected '$expected'."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  assets:
    name: Attach release assets
    needs: [binaries, dist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      # actions/attest documents this one only for the storage record of push-to-registry,
      # which is off here. Unverified until a release runs without it.
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # An a, b, rc or .dev version must not stay the Latest release. A plain .post version
      # is a normal release.
      - name: Mark prerelease
        run: |
          version=${TAG#v}
          if [[ "$version" =~ (a|b|rc)[0-9]+ || "$version" =~ \.dev[0-9]+ ]]; then
            gh release edit "$TAG" --prerelease --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # The release is already published, so immutable releases must stay off for the repo.
      # --clobber lets a re-run replace what an earlier attempt uploaded.
      - name: Attach assets
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  # PyPI accepts each version once, so this job runs last and every job before it can be
  # re-run.
  pypi:
    name: Publish to PyPI
    needs: assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Publish
        run: uv publish --trusted-publishing always
