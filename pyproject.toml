[project]
name = "hfox"
version = "0.1.0"
description = "Command-line interface for the HappyFox REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Leo Herzog" }]
keywords = ["happyfox", "helpdesk", "cli", "support", "tickets"]
dependencies = [
    "typer>=0.27.2",
    "httpx>=0.28.1",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/leoherzog/happyfox-mcp"
Source = "https://github.com/leoherzog/happyfox-mcp"

[project.scripts]
hfox = "hfox.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hfox"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer's idiom is `arg: T = typer.Option(...)` — a call in the default is intended.
ignore = ["B008"]
